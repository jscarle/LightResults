name: Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'csharp'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore ./tests/LightResults.Tests/LightResults.Tests.csproj

      - name: Build
        run: dotnet build ./tests/LightResults.Tests/LightResults.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test ./tests/LightResults.Tests/LightResults.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
