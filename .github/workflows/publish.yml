name: Publish

on:
  release:
    types:
      - published

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build ./src/LightResults/LightResults.csproj --configuration Release --no-restore

    - name: Pack
      run: dotnet pack ./src/LightResults/LightResults.csproj --configuration Release --no-build --output .

    - name: NuGet Login
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{secrets.NUGET_USER}}

    - name: Push to NuGet
      run: dotnet nuget push "*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
